# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  drop_columns: ["id", "decile_score", "score_text"]  # identifiers / COMPAS's own score, not our model's inputs

diagnostics:
  id_column: "id"
  numeric_text_columns: ["priors_count" , "prior_offenses"] 
  placeholder_tokens: ["-" , "?" , "n/a" , "NA" , "na" , "N/A" , ""]
  
  validity_rules: 
    age: {min: 18 , max: 100}
    decile_score: {min: 1 , max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0 , max: 60}

  canonical_categories:
    sex:
      male: "Male"
      female: "Female"

    race: 
      african-american: "African-American" 
      african american: "African-American"
      hispanic: "Hispanic"
      caucasian: "Caucasian"
      asian: "Asian" 
      native american: "Native American"
      other: "Other"

    c_charge_degree: 
      felony: "F"
      f: "F"
      m: "M"
      misdemeanor: "M"
      
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"

  redundant_columns: ["prior_offenses" , "age_in_months" , "juvenile_total"]

preprocessing: 
  encoder: "target" # options: onehot | ordinal | count | target
  scaler: "robust"  # options: none | standard | minmax | robust
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count" , "c_charge_degree"]
  random_state: 42
  imputation: 
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

test_set: 
  size: 0.2
  random_state: 42

# Stratified k-fold CV on the development set (everything except the test set).
cv: 
  n_splits: 5
  shuffle: True
  random_state: 42
  scoring: "accuracy"
  n_jobs: 1

model:
  type: "random_forest" #options "dummy" |"decision_tree" | "random_forest" | "logistic_regression"
  params: #{}
    #max_iter: 2000
    random_state: 42
    n_estimators: 300
    n_jobs: -1

output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
